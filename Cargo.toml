[package]
# Basic package metadata
name = "SignalDecryption"  # The name of your Rust package
version = "1.1.0"          # The version of your package
edition = "2021"           # The Rust edition your package is using
authors = ["John Feng"]  # Author information
description = "Recover and query Signal Desktop's SQLCipher key on macOS, Windows and Linux"
autobins = false           # bins are declared explicitly below

# Shared library: the key-recovery core, used by both binaries.
[lib]
name = "signal_core"
path = "src/lib.rs"

# Binary 1: print the recovered key.
[[bin]]
name = "SignalDecryption"
path = "src/bin/SignalDecryption/main.rs"

# Binary 2: open Signal's database with the recovered key and run SQL.
[[bin]]
name = "signal-sqlite"
path = "src/bin/signal-sqlite/main.rs"
required-features = ["sqlite"]

[dependencies]
# Cross-platform dependencies (used by every target)

# Dependency on hex for encoding and decoding hexadecimal strings
hex = "0.4.3"  # The hex crate, version 0.4.3

# Dependency on serde_json for JSON handling
serde_json = { version = "1.0", default-features = false, features = ["std"] }  # Enable `std` feature explicitly

# --- Shared RustCrypto primitives ---
# os_crypt (macOS/Linux) uses AES-128-CBC + PBKDF2-SHA1.
aes = "0.7.5"                                           # AES block cipher (128 + 256)
block-modes = "0.8.1"                                   # CBC mode
pbkdf2 = { version = "0.10", features = ["std"] }       # PBKDF2 key derivation
hmac = "0.12.1"                                          # HMAC (SHA1)

# SQLCipher for `signal-sqlite`: it opens Signal's database itself, read-only.
# Optional: only the `sqlite` feature pulls it in.
rusqlite = { version = "0.43", features = ["bundled-sqlcipher", "serialize"], optional = true }
# SQLCipher's crypto is crates/sqlcipher-rustcrypto (RustCrypto, no OpenSSL or
# CommonCrypto), so every target cross-compiles from any host. The feature is
# added by our copy of libsqlite3-sys in vendor/ (see [patch.crates-io]).
libsqlite3-sys = { version = "0.40", features = ["bundled-sqlcipher-custom-crypto"], optional = true }

# Subcommand CLI framework for `signal-sqlite` (query/tables/schema/repl/mcp).
# Pure Rust, cross-compiles to every target; gated with rusqlite behind `sqlite`
# so the default build and `SignalDecryption` stay dependency-light.
clap = { version = "4", features = ["derive"], optional = true }

[features]
# `signal-sqlite` needs a SQLite engine and its subcommand CLI; `SignalDecryption`
# needs neither. Gating both keeps the default build (and SignalDecryption) free
# of the C SQLite and the clap dependency tree.
sqlite = ["dep:rusqlite", "dep:libsqlite3-sys", "dep:clap"]

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
# os_crypt PRF (macOS/Linux only): PBKDF2-HMAC-SHA1.
sha1 = "0.10.1"  # The sha1 crate, version 0.10.1

[target.'cfg(target_os = "macos")'.dependencies]
# macOS backend: master password lives in the Keychain

# Access to the system Keychain
keyring = "1.2.0"  # The keyring crate, version 1.2.0

[target.'cfg(target_os = "linux")'.dependencies]
# Linux backend: v11 master password lives in the Secret Service (libsecret).
# Pure-Rust D-Bus client (zbus) + RustCrypto session, no C libsecret linkage.
secret-service = { version = "4", features = ["rt-async-io-crypto-rust"] }

[target.'cfg(windows)'.dependencies]
# Windows backend: DPAPI (Local State) -> AES-256-GCM (config.json)

# AES-256-GCM authenticated decryption
aes-gcm = "0.10"  # The aes-gcm crate, version 0.10

# base64 for decoding os_crypt.encrypted_key in Local State
base64 = "0.22"  # The base64 crate, version 0.22

# Win32 DPAPI bindings (CryptUnprotectData) and LocalFree
# (+ CreateFileW with an owner-only DACL for signal-sqlite's plaintext export)
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }

[profile.release]
# Release profile optimizations

opt-level = 3  # Maximum optimization level for performance
lto = "fat"  # Use "fat" link-time optimization for better performance at the cost of longer compile times
codegen-units = 1  # Set to 1 to allow the compiler to optimize across the entire crate, improving performance but increasing compile time
panic = 'abort'  # Abort on panic to reduce binary size by not including unwinding code
strip = true  # Remove symbols from the final binary to reduce size
debug = false  # Disable debug information to reduce binary size and remove source file references
incremental = false  # Disable incremental compilation for release builds to improve runtime performance at the cost of longer compile times
overflow-checks = false  # Disable overflow checks in release builds to improve performance; this should only be done if you're sure overflows won't occur

# libsqlite3-sys 0.40.0 from crates.io plus the `bundled-sqlcipher-custom-crypto`
# feature; vendor/README.md lists every change.
[patch.crates-io]
libsqlite3-sys = { path = "vendor/libsqlite3-sys" }

# The crypto provider is a member so `cargo test -p sqlcipher-rustcrypto` runs
# its known-answer tests; the vendored crate is not ours to lint or test.
[workspace]
members = ["crates/sqlcipher-rustcrypto"]
exclude = ["vendor"]
